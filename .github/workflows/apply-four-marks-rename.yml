name: apply-four-marks-rename
on:
  push:
    branches: ["rename/four-marks-2026-10-01"]
    paths: [".github/rename/**", ".github/workflows/apply-four-marks-rename.yml"]
permissions:
  contents: write
jobs:
  apply:
    if: github.ref == 'refs/heads/rename/four-marks-2026-10-01'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rename/four-marks-2026-10-01
      - name: Apply rename
        run: python3 .github/rename/apply_site.py .
      - name: Remove this one-shot job
        run: git rm -r -q .github/rename .github/workflows/apply-four-marks-rename.yml
      - name: Commit
        run: |
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit --author="aaronmaberry <323684361+aaronmaberry@users.noreply.github.com>" -m "Rename the four marks on the site and the app feed" -m "Stop Waiting, Pick Up the Weight, Go First, Work for God's Pay. New creed. Mark verses match the book. Old mark wording and the Robert Lewis line removed. Protected pages untouched except one t-table sentence that named the old marks. Preview only; not for main until Aaron signs off."
          git push origin HEAD:rename/four-marks-2026-10-01
